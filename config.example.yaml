# Copy to ~/.msc/config.yaml — do not put API keys in this file.
# LLM keys belong in ~/.metagpt/config2.yaml (see vendor/MetaGPT/config/config2.example.yaml).

workspace_root: ./workspace
orgs_root: orgs
agency_agents_root: vendor/agency-agents
# metagpt_config: ~/.metagpt/config2.yaml
# llm_api_type: openrouter
default_org: startup-mvp
default_budget: 15.0
default_rounds: 20
# OpenRouter models — all default to Gemini 2.0 Flash (multi-provider, avoids quota 402s).
# Override individual tiers as needed.
llm_tiers:
  economy: meta-llama/llama-3.1-8b-instruct
  standard: openai/gpt-oss-20b
  premium: openai/gpt-oss-120b
