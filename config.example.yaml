# Copy to ~/.msc/config.yaml — do not put API keys in this file.
# LLM keys belong in ~/.metagpt/config2.yaml (see vendor/MetaGPT/config/config2.example.yaml).

workspace_root: ./workspace
orgs_root: orgs
agency_agents_root: vendor/agency-agents
# metagpt_config: ~/.metagpt/config2.yaml
# llm_api_type: openrouter
default_org: startup-mvp
default_budget: 15.0
default_rounds: 20
# OpenRouter models (see config/metagpt.openrouter.example.yaml + OPENROUTER_API_KEY in .env)
llm_tiers:
  economy: deepseek/deepseek-v4-flash:free
  standard: google/gemma-4-31b-it:free
  premium: moonshotai/kimi-k2.6
