name: incident-response
description: Production incident triage and remediation (NEXUS-Micro)
source_runbook: vendor/agency-agents/strategy/runbooks/scenario-incident-response.md
mode: nexus-micro
license: oss
budget_default: 8.0
orchestrator:
  agent: vendor/agency-agents/specialized/agents-orchestrator.md
  metagpt_class: TeamLeader
roles:
  - agent: vendor/agency-agents/support/support-infrastructure-maintainer.md
    tools: [Editor, Terminal]
    llm_tier: premium
  - agent: vendor/agency-agents/engineering/engineering-devops-automator.md
    tools: [Editor, Terminal]
    llm_tier: standard
  - agent: vendor/agency-agents/engineering/engineering-incident-response-commander.md
    tools: [Editor, Terminal]
    llm_tier: premium
  - agent: vendor/agency-agents/testing/testing-evidence-collector.md
    tools: [Browser, Editor]
    llm_tier: economy
    role: quality_gate
  - agent: vendor/agency-agents/testing/testing-reality-checker.md
    role: final_gate
phases:
  - id: triage
    playbook: vendor/agency-agents/strategy/playbooks/phase-0-discovery.md
    agents: [support-infrastructure-maintainer, engineering-incident-response-commander]
    parallel: true
  - id: remediate
    playbook: vendor/agency-agents/strategy/playbooks/phase-3-build.md
    agents: [engineering-devops-automator, support-infrastructure-maintainer, testing-evidence-collector]
    dev_qa_loop: true
gates:
  max_retries: 3
  require_evidence: true
  phase_advance: reality_checker_pass
human_review:
  required: true
  before: [deliver]
