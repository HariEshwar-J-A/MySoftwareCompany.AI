name: fintech-studio
description: Regulated fintech MVP studio — compliance-first build (NEXUS-Sprint)
source_runbook: vendor/agency-agents/strategy/runbooks/scenario-startup-mvp.md
mode: nexus-sprint
license: premium
pack_id: fintech-studio
budget_default: 25.0
orchestrator:
  agent: vendor/agency-agents/specialized/agents-orchestrator.md
  metagpt_class: TeamLeader
roles:
  - agent: vendor/agency-agents/finance/finance-financial-analyst.md
    tools: [Editor, Terminal]
    llm_tier: premium
  - agent: vendor/agency-agents/engineering/engineering-backend-architect.md
    tools: [Editor, Terminal]
    llm_tier: premium
  - agent: vendor/agency-agents/support/support-legal-compliance-checker.md
    tools: [Editor]
    llm_tier: standard
  - agent: vendor/agency-agents/engineering/engineering-frontend-developer.md
    tools: [Editor, Terminal, Browser]
    llm_tier: standard
  - agent: vendor/agency-agents/testing/testing-evidence-collector.md
    tools: [Browser, Editor]
    llm_tier: economy
    role: quality_gate
  - agent: vendor/agency-agents/testing/testing-reality-checker.md
    role: final_gate
phases:
  - id: discovery
    playbook: vendor/agency-agents/strategy/playbooks/phase-0-discovery.md
    agents: [finance-financial-analyst, support-legal-compliance-checker]
    parallel: true
  - id: build
    playbook: vendor/agency-agents/strategy/playbooks/phase-3-build.md
    agents:
      - engineering-backend-architect
      - engineering-frontend-developer
      - testing-evidence-collector
    dev_qa_loop: true
gates:
  max_retries: 3
  require_evidence: true
  phase_advance: reality_checker_pass
human_review:
  required: true
  before: [deliver, phase_advance]
