# Copy to ~/.metagpt/config2.yaml (or set MSC_METAGPT_CONFIG to this file path).
# Set OPENROUTER_API_KEY in repo-root .env — MSC applies tier models per role at runtime.
#
# Tier mapping (economy / standard / premium) is in ~/.msc/config.yaml or MSC_LLM_TIER_* in .env.
# All tiers default to google/gemini-2.0-flash-001 — reliable fallback across providers.

llm:
  api_type: openrouter
  base_url: "https://openrouter.ai/api/v1"
  api_key: "YOUR_OPENROUTER_API_KEY"
  model: google/gemini-2.0-flash-exp:free
