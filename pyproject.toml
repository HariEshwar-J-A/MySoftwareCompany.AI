[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mscai"
version = "0.1.0"
description = "MySoftwareCompany.AI — AI software agencies powered by MetaGPT and agency-agents"
readme = "README.md"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
authors = [{ name = "MySoftwareCompany.AI" }]
keywords = ["ai", "agents", "metagpt", "multi-agent", "software-agency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer>=0.9.0,<0.10",
    "click>=8.0,<8.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
mscai = "msc.cli:app"
msc = "msc.cli:app"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
